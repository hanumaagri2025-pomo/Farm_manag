<script>
  // Defined first, so the loader below can report failures as soon as they
  // happen — the fuller diagnostic UI (showBootError) is defined further
  // down and will pick up anything recorded here the moment it runs.

  // Settings) can trigger it later — Chrome only fires this once, early.
  window.__deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();

  // Loads a script from the first URL that works, trying alternates in order
  // (useful when a single CDN is blocked on a given network but another isn't).
  function __loadWithFallback(urls, label) {
    return new Promise((resolve, reject) => {
      let i = 0;

<script>
  // This runs immediately (plain JS, no Babel/React needed) so it can report a
  // problem even if React/Babel themselves failed to load. If the real app
  // hasn't taken over the page within a few seconds, or a script throws, show
  // a plain-language reason instead of leaving "Loading orchard…" forever.
  var bootDone = false;
  function showBootError(reason) {
    if (bootDone) return; // app already loaded successfully, ignore late/irrelevant errors
    var diag = document.getElementById("boot-diag");
    if (!diag) return;
    diag.innerHTML =
      '<div class="box">' +
      '<h2>Couldn\'t start the app</h2>' +
      '<p>' + reason + '</p>' +
      '<ul>' +
      '<li>Check that this device has an internet connection (needed once, to fetch React/Tailwind/etc.)</li>' +
      '<li>Try a different browser (Chrome or Firefox), or turn off ad blockers / privacy extensions for this file</li>' +
      '<li>If you are on a restricted office/school network, some may block <code>unpkg.com</code> or <code>cdn.tailwindcss.com</code></li>' +
      '<li>Open your browser\'s console (press F12, click "Console") — a red error there tells us exactly what to fix</li>' +
      '</ul>' +
      '<button onclick="location.reload()">Try again</button>' +
      '</div>';

    .then(() => {
      // React + ReactDOM are ready — pull in the app's (precompiled, plain-JS)
      // source, which was kept inert until now, and actually run it.
      const src = document.getElementById("app-source").textContent;
      const s = document.createElement("script");
      s.textContent = src;
      document.body.appendChild(s);

    .catch(() => {

      } else {

      }
    }

</script>
